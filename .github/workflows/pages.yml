name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
      # Pre-merge branch for Word Golf; remove once merged to master.
      - claude/word-climb-game-z5qi76
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          # Serve the repo as-is: NBA app at /, Word Golf at /word-golf/.
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
